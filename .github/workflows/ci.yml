name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes the coverage badge to the badges branch
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock pytest pytest-cov httpx ruff "fakeredis[lua]"

      - name: Lint
        run: ruff check .

      - name: Train model (smoke test)
        run: python -m nexus_sec.train --out-dir /tmp/model

      - name: Test
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          # The e2e tests score generated APKs with the model trained above
          MODEL_DIR: /tmp/model
        run: pytest --cov --cov-report=term

      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # A one-file orphan branch read by shields.io; no third-party service
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(coverage report --format=total)
          if [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 80 ]; then color=green
          else color=yellow; fi

          mkdir -p /tmp/badges && cd /tmp/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$pct" "$color" > coverage.json

          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Update coverage badge: ${pct}%"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images
        run: docker compose build
